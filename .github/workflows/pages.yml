name: Website (GitHub Pages)

# Publishes the one-page site in site/ to GitHub Pages
# (https://matt-shearing.github.io/thrum/) on every change to the site, and
# when started by hand. Pages must be switched on for this repository with
# "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leave the build tools and previews out of the published site
        run: rm -rf site/tools site/preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
